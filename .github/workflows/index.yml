name: Update index.json

# Runs only after a merge lands on main — never on a PR, so it's the one
# workflow trusted with write access. Two independent guards against a
# commit loop: the trigger ignores changes to index.json itself (the only
# file this job ever touches), and the job also skips its own commit when
# regeneration produces no diff. (Belt and suspenders: pushes made with the
# default GITHUB_TOKEN don't retrigger workflows in the first place, but
# this workflow doesn't rely on that alone.)
on:
  push:
    branches: [main]
    paths-ignore:
      - "index.json"

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Validate before indexing
        run: python3 scripts/validate_templates.py templates

      - name: Regenerate index.json
        run: python3 scripts/build_index.py --out index.json

      - name: Commit index.json if it changed
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Regenerate index.json [skip ci]"
          git push
