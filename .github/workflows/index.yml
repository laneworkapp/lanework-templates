name: Update index.json

# Runs after every push to main — never on a PR, so it's the one workflow
# trusted with write access. Guarded against a commit loop two ways: the
# commit message carries "[skip ci]", and the job skips its own commit
# outright when regeneration produces no diff. (A push made with the
# default GITHUB_TOKEN doesn't retrigger a workflow in the first place,
# but this workflow doesn't rely on that alone.) `concurrency` serializes
# runs so two merges in quick succession can't race to push index.json.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: index-json
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Validate before indexing
        run: python3 scripts/validate_templates.py templates

      - name: Regenerate index.json
        run: python3 scripts/build_index.py --out index.json

      - name: Commit index.json if it changed
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Regenerate index.json [skip ci]"
          git push
